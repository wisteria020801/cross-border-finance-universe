<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>金融知识宇宙</title>
<meta name="theme-color" content="#050A14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="金融宇宙">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon.svg">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { background: #050A14; overflow: hidden; font-family: -apple-system, 'PingFang SC', sans-serif; width: 100vw; height: 100vh; }

canvas { position: fixed; top: 0; left: 0; pointer-events: none; z-index: 0; }

#universe { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; overflow: hidden; touch-action: none; }

/* 节点 */
.node {
  position: absolute;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.3s ease;
  text-align: center;
  user-select: none;
  z-index: 10;
}
.node:active { transform: scale(0.93) !important; }
.node.dimmed { opacity: 0.15; }
.node.highlighted { transform: scale(1.18); z-index: 20; }
.node-label {
  position: absolute;
  white-space: nowrap;
  font-size: 10px;
  font-weight: 600;
  color: rgba(255,255,255,0.75);
  pointer-events: none;
  text-shadow: 0 0 8px rgba(0,0,0,0.8);
}

/* 详情面板 */
#panel {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: rgba(10, 18, 35, 0.97);
  border-top: 1px solid rgba(255,255,255,0.08);
  border-radius: 20px 20px 0 0;
  padding: 20px 20px 36px;
  z-index: 100;
  transform: translateY(100%);
  transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
  backdrop-filter: blur(20px);
  max-height: 55vh;
  overflow-y: auto;
  padding-top: max(20px, env(safe-area-inset-bottom));
}
#panel.open { transform: translateY(0); }
#panel-handle { width: 36px; height: 4px; background: rgba(255,255,255,0.15); border-radius: 2px; margin: 0 auto 16px; }
#panel-category { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 6px; font-weight: 600; }
#panel-title { font-size: 18px; font-weight: 700; color: #F1F5F9; margin-bottom: 12px; }
#panel-body { font-size: 13px; color: #94A3B8; line-height: 1.8; }
#panel-body strong { color: #E2E8F0; }
#panel-body .tag {
  display: inline-block; font-size: 10px; font-weight: 600;
  padding: 2px 10px; border-radius: 20px; margin: 6px 4px 0 0;
}
#panel-close {
  position: absolute; top: 16px; right: 16px;
  width: 28px; height: 28px; border-radius: 50%;
  background: rgba(255,255,255,0.08); border: none;
  color: #64748B; font-size: 14px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}

/* 提示 */
#hint {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
  text-align: center; pointer-events: none; z-index: 5;
  animation: fadeHint 3s ease 1.5s forwards;
  opacity: 0;
}
#hint p { font-size: 12px; color: rgba(255,255,255,0.3); letter-spacing: 1px; }
@keyframes fadeHint {
  0% { opacity: 0; } 20% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; }
}

/* 图例 */
#legend {
  position: fixed; top: 64px; left: 16px; z-index: 50;
  display: flex; flex-direction: column; gap: 5px;
}
.legend-item {
  display: flex; align-items: center; gap: 6px;
  cursor: pointer; padding: 4px 8px; border-radius: 10px;
  transition: background 0.2s, opacity 0.2s;
}
.legend-item.active { background: rgba(255,255,255,0.08); }
.legend-item.dimmed { opacity: 0.35; }
.legend-dot { width: 8px; height: 8px; border-radius: 50%; }
.legend-text { font-size: 10px; color: rgba(255,255,255,0.5); }

#title-bar {
  position: fixed; top: 12px; right: 16px; z-index: 50; text-align: right;
}
#title-bar h1 { font-size: 13px; color: rgba(255,255,255,0.6); font-weight: 600; letter-spacing: 1px; }
#title-bar p { font-size: 10px; color: rgba(255,255,255,0.25); margin-top: 2px; }

/* 搜索按钮 */
#search-btn {
  position: fixed; top: 12px; left: 16px; z-index: 60;
  width: 38px; height: 38px; border-radius: 50%;
  background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.10);
  color: rgba(255,255,255,0.8); font-size: 15px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; backdrop-filter: blur(12px);
  padding-top: env(safe-area-inset-top);
  margin-top: env(safe-area-inset-top);
}

/* AI 问答按钮 */
#ai-btn {
  position: fixed; bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); right: 20px; z-index: 60;
  width: 56px; height: 56px; border-radius: 50%;
  background: linear-gradient(135deg, #6366F1 0%, #8B5CF6 50%, #EC4899 100%);
  border: none;
  color: white; font-size: 22px; font-weight: 600;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  box-shadow: 0 8px 24px rgba(139,92,246,0.4), 0 0 0 1px rgba(255,255,255,0.1) inset;
  backdrop-filter: blur(12px);
  transition: transform 0.15s ease, box-shadow 0.15s ease;
  animation: ai-pulse 3s ease-in-out infinite;
}
#ai-btn:active { transform: scale(0.92); }
@keyframes ai-pulse {
  0%, 100% { box-shadow: 0 8px 24px rgba(139,92,246,0.4), 0 0 0 1px rgba(255,255,255,0.1) inset; }
  50% { box-shadow: 0 8px 32px rgba(236,72,153,0.6), 0 0 0 1px rgba(255,255,255,0.2) inset; }
}

/* AI 问答面板 */
#ai-overlay {
  position: fixed; inset: 0; z-index: 210;
  background: rgba(5,10,20,0.98);
  backdrop-filter: blur(20px);
  transform: translateY(100%);
  transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
  display: flex; flex-direction: column;
  padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 0;
}
#ai-overlay.open { transform: translateY(0); }
#ai-header {
  display: flex; align-items: center; gap: 10px;
  padding: 4px 0 12px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}
#ai-header-icon {
  width: 32px; height: 32px; border-radius: 50%;
  background: linear-gradient(135deg, #6366F1 0%, #EC4899 100%);
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
}
#ai-header-title { font-size: 15px; color: #F1F5F9; font-weight: 500; flex: 1; }
#ai-header-title small { display: block; font-size: 11px; color: #64748B; font-weight: 400; margin-top: 2px; }
#ai-close {
  width: 32px; height: 32px; border-radius: 50%;
  background: rgba(255,255,255,0.08); border: none;
  color: #94A3B8; font-size: 13px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
}

#ai-chat {
  flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: 16px 0;
  display: flex; flex-direction: column; gap: 14px;
}
.ai-msg { max-width: 92%; animation: ai-msg-in 0.3s ease; }
@keyframes ai-msg-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.ai-msg-user {
  align-self: flex-end;
  background: linear-gradient(135deg, rgba(99,102,241,0.25), rgba(139,92,246,0.25));
  border: 1px solid rgba(139,92,246,0.3);
  padding: 10px 14px; border-radius: 16px 16px 4px 16px;
  color: #F1F5F9; font-size: 14px; line-height: 1.6;
}
.ai-msg-bot {
  align-self: flex-start;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.08);
  padding: 12px 14px; border-radius: 4px 16px 16px 16px;
  color: #CBD5E1; font-size: 14px; line-height: 1.7;
}
.ai-msg-bot strong { color: #F1F5F9; }
.ai-msg-bot .ai-source {
  display: inline-block;
  margin-top: 8px; padding: 6px 10px;
  background: rgba(99,102,241,0.15);
  border: 1px solid rgba(99,102,241,0.3);
  border-radius: 8px;
  color: #C7D2FE; font-size: 12px;
  cursor: pointer;
}
.ai-msg-bot .ai-source:active { background: rgba(99,102,241,0.3); }
.ai-msg-bot .ai-related {
  margin-top: 10px; padding-top: 10px;
  border-top: 1px dashed rgba(255,255,255,0.08);
  font-size: 12px; color: #64748B;
}
.ai-msg-bot .ai-related-chip {
  display: inline-block; margin: 4px 4px 0 0;
  padding: 4px 10px; border-radius: 12px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.08);
  color: #94A3B8; font-size: 12px;
  cursor: pointer;
}
.ai-msg-bot .ai-related-chip:active { background: rgba(255,255,255,0.1); color: #F1F5F9; }
.ai-msg-typing {
  align-self: flex-start;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.08);
  padding: 12px 16px; border-radius: 4px 16px 16px 16px;
  color: #94A3B8; font-size: 13px;
}
.ai-msg-typing::after {
  content: '●●●';
  letter-spacing: 3px;
  animation: ai-typing 1.2s infinite;
}
@keyframes ai-typing { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

#ai-suggestions {
  padding: 8px 0 12px;
  display: flex; gap: 8px; overflow-x: auto;
  -ms-overflow-style: none; scrollbar-width: none;
}
#ai-suggestions::-webkit-scrollbar { display: none; }
.ai-sugg-chip {
  flex-shrink: 0;
  padding: 8px 14px; border-radius: 16px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  color: #94A3B8; font-size: 12px;
  cursor: pointer; white-space: nowrap;
}
.ai-sugg-chip:active { background: rgba(139,92,246,0.15); border-color: rgba(139,92,246,0.3); color: #C7D2FE; }

#ai-input-wrap {
  display: flex; gap: 8px;
  padding: 12px 0 calc(env(safe-area-inset-bottom, 0px) + 12px);
  border-top: 1px solid rgba(255,255,255,0.08);
}
#ai-input {
  flex: 1; padding: 12px 14px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.10);
  border-radius: 12px;
  color: #F1F5F9; font-size: 15px;
  outline: none; font-family: inherit;
}
#ai-input::placeholder { color: #64748B; }
#ai-input:focus { border-color: rgba(139,92,246,0.4); }
#ai-send {
  width: 44px; height: 44px; border-radius: 12px;
  background: linear-gradient(135deg, #6366F1, #8B5CF6);
  border: none; color: white; font-size: 16px;
  cursor: pointer; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
#ai-send:active { transform: scale(0.95); }
#ai-send:disabled { opacity: 0.4; }

/* 搜索 overlay */
#search-overlay {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(5,10,20,0.98);
  backdrop-filter: blur(20px);
  transform: translateY(-100%);
  transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
  display: flex; flex-direction: column;
  padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 16px;
}
#search-overlay.open { transform: translateY(0); }
#search-input {
  width: 100%; padding: 14px 16px; margin-top: 8px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.10);
  border-radius: 12px;
  color: #F1F5F9; font-size: 16px;
  outline: none; font-family: inherit;
}
#search-input::placeholder { color: #64748B; }
#search-input:focus { border-color: rgba(255,255,255,0.20); }
#search-close {
  position: absolute; top: calc(env(safe-area-inset-top, 0px) + 12px); right: 16px;
  width: 36px; height: 36px; border-radius: 50%;
  background: rgba(255,255,255,0.08); border: none;
  color: #94A3B8; font-size: 14px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
}
#search-results {
  flex: 1; overflow-y: auto; margin-top: 12px;
  -webkit-overflow-scrolling: touch;
  padding-bottom: 40px;
}
.search-result {
  padding: 14px 16px; border-radius: 12px;
  margin-bottom: 6px; cursor: pointer;
  background: rgba(255,255,255,0.03);
  border: 1px solid transparent;
  transition: background 0.2s, border 0.2s, transform 0.15s;
}
.search-result:active { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.10); transform: scale(0.98); }
.sr-cat { font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 600; }
.sr-title { font-size: 15px; font-weight: 600; color: #F1F5F9; margin: 4px 0; }
.sr-snippet {
  font-size: 12px; color: #64748B; line-height: 1.5;
  overflow: hidden; text-overflow: ellipsis;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
}
.search-empty { text-align: center; color: #64748B; font-size: 13px; padding: 40px 20px; }
.search-hint { font-size: 11px; color: #475569; padding: 12px 4px; }

/* 拖动 */
#universe { cursor: grab; }
#universe.dragging { cursor: grabbing; }
</style>
</head>
<body>

<canvas id="lines"></canvas>
<div id="universe"></div>

<button id="search-btn" aria-label="搜索">🔍</button>

<div id="search-overlay">
  <button id="search-close" aria-label="关闭搜索">✕</button>
  <input id="search-input" type="search" placeholder="输入关键词，如 CRS、信托、837号令…" autocomplete="off" autocapitalize="off" autocorrect="off">
  <div id="search-results">
    <div class="search-hint">支持搜索节点标题、分类、标签和正文内容。</div>
  </div>
</div>

<button id="ai-btn" aria-label="AI 问答">✦</button>

<div id="ai-overlay">
  <div id="ai-header">
    <div id="ai-header-icon">✦</div>
    <div id="ai-header-title">金融宇宙 AI <small>基于 66 个知识节点 · 完全离线</small></div>
    <button id="ai-close" aria-label="关闭">✕</button>
  </div>
  <div id="ai-chat"></div>
  <div id="ai-suggestions"></div>
  <div id="ai-input-wrap">
    <input id="ai-input" type="text" placeholder="问我任何金融问题…" autocomplete="off" autocapitalize="off" autocorrect="off">
    <button id="ai-send" aria-label="发送">➤</button>
  </div>
</div>

<div id="hint"><p>✦ 点击节点探索金融世界 · 双指缩放 · 双击复位</p></div>

<div id="legend">
  <div class="legend-item" data-category="税务体系"><div class="legend-dot" style="background:#F59E0B"></div><span class="legend-text">税务体系</span></div>
  <div class="legend-item" data-category="架构工具"><div class="legend-dot" style="background:#3B82F6"></div><span class="legend-text">架构工具</span></div>
  <div class="legend-item" data-category="监管合规"><div class="legend-dot" style="background:#EC4899"></div><span class="legend-text">监管合规</span></div>
  <div class="legend-item" data-category="金融产品"><div class="legend-dot" style="background:#10B981"></div><span class="legend-text">金融产品</span></div>
  <div class="legend-item" data-category="主体身份"><div class="legend-dot" style="background:#8B5CF6"></div><span class="legend-text">主体身份</span></div>
  <div class="legend-item" data-category="资金通道"><div class="legend-dot" style="background:#EF4444"></div><span class="legend-text">资金通道</span></div>
  <div class="legend-item" data-category="地区监管"><div class="legend-dot" style="background:#F97316"></div><span class="legend-text">地区监管</span></div>
  <div class="legend-item" data-category="宏观经济"><div class="legend-dot" style="background:#06B6D4"></div><span class="legend-text">宏观经济</span></div>
  <div class="legend-item" data-category="公司金融"><div class="legend-dot" style="background:#14B8A6"></div><span class="legend-text">公司金融</span></div>
  <div class="legend-item" data-category="投资理论"><div class="legend-dot" style="background:#D946EF"></div><span class="legend-text">投资理论</span></div>
</div>

<div id="title-bar">
  <h1>金融知识宇宙</h1>
  <p>拖动 · 点击 · AI 问答</p>
</div>

<div id="panel">
  <div id="panel-handle"></div>
  <button id="panel-close">✕</button>
  <div id="panel-category"></div>
  <div id="panel-title"></div>
  <div id="panel-body"></div>
</div>

<script>
const W = window.innerWidth;
const H = window.innerHeight;
const CX = W / 2;
const CY = H / 2;

// ── 节点数据 ──────────────────────────────────────────────
const nodes = [
  // 中心
  {
    id: 'root', label: '金融\n体系', x: CX, y: CY,
    size: 64, color: '#FFFFFF', textColor: '#0F172A', fontSize: 12,
    category: '总览', glow: 'rgba(255,255,255,0.3)',
    title: '金融知识宇宙',
    body: `欢迎来到<strong>金融知识宇宙</strong>——一个覆盖跨境金融、宏观经济、公司金融、投资理论的完整金融知识图谱。\n\n<strong>十大模块：</strong>\n· 税务体系 · 架构工具 · 监管合规 · 金融产品 · 主体身份 · 资金通道 · 地区监管\n· 宏观经济 · 公司金融 · 投资理论\n\n<strong>使用方式：</strong>\n· 拖动节点移动视图\n· 滚轮或双指缩放\n· 点击节点查看详情\n· 点击图例按类别筛选\n· 点击 ✦ 使用 AI 问答`,
    tags: []
  },

  // ── 税务体系（金黄）──
  {
    id: 'tax', label: '税务体系', x: CX - 170, y: CY - 100,
    size: 48, color: '#F59E0B', glow: 'rgba(245,158,11,0.4)',
    category: '税务体系',
    title: '税务体系',
    body: `税务是跨境金融的底层逻辑。<strong>钱在哪产生、在哪流动、谁收到</strong>，每一步都可能被征税。\n\n三个核心问题：\n1. 征税对象是什么？\n2. 纳税主体是谁？\n3. 税基怎么算？\n\n跨境架构设计的本质，就是在合法范围内优化这三个问题的答案。`,
    tags: ['第一层知识']
  },
  {
    id: 'vat', label: '增值税\nVAT', x: CX - 290, y: CY - 170,
    size: 36, color: '#F59E0B', glow: 'rgba(245,158,11,0.3)',
    parent: 'tax', category: '税务体系',
    title: '增值税 VAT',
    body: `对<strong>商品销售或服务提供产生的增值部分</strong>征税，不是对全部收入。\n\n通过"进项税-销项税"抵扣机制实现，企业只交增值的那部分。\n\n<strong>税率：</strong>13%（货物）/ 9%（部分服务）/ 6%（现代服务/金融）\n\n<strong>跨境关键：</strong>\n· 出口货物→零税率+退还已交进项税（真金白银退钱）\n· 服务跨境→满足条件可申请零税率\n· 中国鼓励出口，让货物以不含税价格进入国际市场`,
    tags: ['境内税', '出口退税']
  },
  {
    id: 'cit', label: '企业\n所得税', x: CX - 270, y: CY - 60,
    size: 36, color: '#F59E0B', glow: 'rgba(245,158,11,0.3)',
    parent: 'tax', category: '税务体系',
    title: '企业所得税 CIT',
    body: `对企业<strong>利润</strong>（收入-成本-费用）征税。\n\n<strong>中国标准税率：25%</strong>\n· 高新技术企业：15%\n· 小微企业（2024-2027优惠）：年应纳税所得额≤300万元，按25%计入应纳税所得额，按20%税率→实际税负5%\n· 西部大开发鼓励类产业：15%\n\n<strong>跨境最大的坑：</strong>\n实际管理控制地(POEM)——如果一家BVI公司的董事决策、日常管理实际都在中国发生，中国税务局可认定它是"中国税务居民企业"，按25%征税。注册在BVI不等于免税！`,
    tags: ['境内税', '25%', '实际管理控制地']
  },
  {
    id: 'iit', label: '个人\n所得税', x: CX - 240, y: CY + 60,
    size: 36, color: '#F59E0B', glow: 'rgba(245,158,11,0.3)',

// ── 画布和布局 ────────────────────────────────────────────
const canvas = document.getElementById('lines');
const ctx = canvas.getContext('2d');
canvas.width = W; canvas.height = H;

const universe = document.getElementById('universe');

// 视图状态：偏移 + 缩放
let offsetX = 0, offsetY = 0, scale = 1;
let dragging = false, lastX = 0, lastY = 0;
let activeNode = null;       // 当前高亮的节点
let activeCategory = null;   // 当前筛选的模块

// 触摸/鼠标拖动
universe.addEventListener('mousedown', e => {
  dragging = true; lastX = e.clientX; lastY = e.clientY;
  universe.classList.add('dragging');
});
universe.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    dragging = true; lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
  } else if (e.touches.length === 2) {
    dragging = false;
    pinchStartDist = touchDist(e);
    pinchStartScale = scale;
  }
}, { passive: true });

window.addEventListener('mousemove', e => {
  if (!dragging) return;
  offsetX += e.clientX - lastX; offsetY += e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  renderAll();
});
window.addEventListener('touchmove', e => {
  if (e.touches.length === 1 && dragging) {
    offsetX += e.touches[0].clientX - lastX; offsetY += e.touches[0].clientY - lastY;
    lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
    renderAll();
  } else if (e.touches.length === 2) {
    const d = touchDist(e);
    scale = Math.min(3, Math.max(0.5, pinchStartScale * (d / pinchStartDist)));
    renderAll();
  }
}, { passive: true });

window.addEventListener('mouseup', () => { dragging = false; universe.classList.remove('dragging'); });
window.addEventListener('touchend', handleTouchEnd);

// 双指距离
let pinchStartDist = 0, pinchStartScale = 1;
function touchDist(e) {
  const dx = e.touches[0].clientX - e.touches[1].clientX;
  const dy = e.touches[0].clientY - e.touches[1].clientY;
  return Math.sqrt(dx * dx + dy * dy);
}

// 双击/双指点击复位
let lastTap = 0;
function handleTouchEnd(e) {
  dragging = false;
  const now = Date.now();
  if (now - lastTap < 300) { resetView(); }
  lastTap = now;
}
universe.addEventListener('dblclick', resetView);

function resetView() {
  offsetX = 0; offsetY = 0; scale = 1;
  renderAll();
}

// 鼠标滚轮缩放（桌面端）
universe.addEventListener('wheel', e => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? 0.92 : 1.08;
  scale = Math.min(3, Math.max(0.5, scale * delta));
  renderAll();
}, { passive: false });

// 创建节点DOM
const domNodes = {};
nodes.forEach(n => {
  const el = document.createElement('div');
  el.className = 'node';
  el.style.width = n.size + 'px';
  el.style.height = n.size + 'px';
  el.style.marginLeft = -(n.size / 2) + 'px';
  el.style.marginTop = -(n.size / 2) + 'px';
  el.style.background = n.id === 'root'
    ? 'radial-gradient(circle, #FFFFFF 60%, rgba(255,255,255,0.7))'
    : `radial-gradient(circle at 35% 35%, ${lighten(n.color)}, ${n.color})`;
  el.style.boxShadow = `0 0 ${n.size * 0.5}px ${n.glow}, 0 0 ${n.size * 0.2}px ${n.color}`;

  const span = document.createElement('span');
  span.style.cssText = `font-size:${n.fontSize || 9}px;font-weight:700;color:${n.textColor || '#fff'};line-height:1.3;white-space:pre-line;text-align:center;pointer-events:none;padding:2px;`;
  span.textContent = n.label;
  el.appendChild(span);

  el.addEventListener('click', (e) => { e.stopPropagation(); openPanel(n); });
  el.addEventListener('touchend', (e) => {
    if (!dragging) { e.preventDefault(); openPanel(n); }
  }, { passive: false });

  universe.appendChild(el);
  domNodes[n.id] = el;
});

function lighten(hex) {
  const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
  return `rgba(${Math.min(r + 60, 255)},${Math.min(g + 60, 255)},${Math.min(b + 60, 255)},1)`;
}

function hexToRgba(hex, a) {
  const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
  return `rgba(${r},${g},${b},${a})`;
}

// 获取节点的邻居（父节点 + 子节点）
function getNeighbors(node) {
  const neighbors = new Set();
  if (node.parent) neighbors.add(node.parent);
  nodes.forEach(n => { if (n.parent === node.id) neighbors.add(n.id); });
  crossLinks.forEach(l => {
    if (l.from === node.id) neighbors.add(l.to);
    if (l.to === node.id) neighbors.add(l.from);
  });
  return neighbors;
}

function renderAll() {
  // 更新节点位置（应用偏移和缩放）
  nodes.forEach(n => {
    const el = domNodes[n.id];
    const x = CX + (n.x - CX) * scale + offsetX;
    const y = CY + (n.y - CY) * scale + offsetY;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
  });
  drawLines();
}

function drawLines() {
  ctx.clearRect(0, 0, W, H);
  const neighborSet = activeNode ? getNeighbors(activeNode) : null;

  nodes.forEach(n => {
    if (!n.parent) return;
    const parent = nodes.find(p => p.id === n.parent);
    if (!parent) return;

    const x1 = CX + (parent.x - CX) * scale + offsetX;
    const y1 = CY + (parent.y - CY) * scale + offsetY;
    const x2 = CX + (n.x - CX) * scale + offsetX;
    const y2 = CY + (n.y - CY) * scale + offsetY;

    // 判断连线是否需要高亮
    const isActive = activeNode && (activeNode.id === n.id || activeNode.id === parent.id);
    const isDimmed = activeNode && !isActive;

    const grad = ctx.createLinearGradient(x1, y1, x2, y2);
    if (isActive) {
      grad.addColorStop(0, hexToRgba(n.color, 0.95));
      grad.addColorStop(1, hexToRgba(n.color, 0.5));
      ctx.lineWidth = 2.2;
      ctx.setLineDash([]);
    } else if (isDimmed) {
      grad.addColorStop(0, hexToRgba(n.color, 0.08));
      grad.addColorStop(1, hexToRgba(n.color, 0.02));
      ctx.lineWidth = 1;
      ctx.setLineDash([2, 8]);
    } else {
      grad.addColorStop(0, hexToRgba(n.color, 0.6));
      grad.addColorStop(1, hexToRgba(n.color, 0.15));
      ctx.lineWidth = 1.2;
      ctx.setLineDash([4, 6]);
    }

    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.strokeStyle = grad;
    ctx.stroke();
    ctx.setLineDash([]);
  });

  // 绘制跨模块连线（虚线 + 不同样式）
  crossLinks.forEach(l => {
    const a = nodes.find(n => n.id === l.from);
    const b = nodes.find(n => n.id === l.to);
    if (!a || !b) return;

    const x1 = CX + (a.x - CX) * scale + offsetX;
    const y1 = CY + (a.y - CY) * scale + offsetY;
    const x2 = CX + (b.x - CX) * scale + offsetX;
    const y2 = CY + (b.y - CY) * scale + offsetY;

    const isActive = activeNode && (activeNode.id === l.from || activeNode.id === l.to);
    const isDimmed = activeNode && !isActive;

    const grad = ctx.createLinearGradient(x1, y1, x2, y2);
    if (isActive) {
      grad.addColorStop(0, 'rgba(255,255,255,0.8)');
      grad.addColorStop(1, 'rgba(255,255,255,0.4)');
      ctx.lineWidth = 1.8;
      ctx.setLineDash([8, 4]);
    } else if (isDimmed) {
      grad.addColorStop(0, 'rgba(255,255,255,0.04)');
      grad.addColorStop(1, 'rgba(255,255,255,0.01)');
      ctx.lineWidth = 0.8;
      ctx.setLineDash([2, 8]);
    } else {
      grad.addColorStop(0, 'rgba(255,255,255,0.35)');
      grad.addColorStop(1, 'rgba(255,255,255,0.1)');
      ctx.lineWidth = 1;
      ctx.setLineDash([6, 6]);
    }

    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.strokeStyle = grad;
    ctx.stroke();
    ctx.setLineDash([]);
  });
}

// 节点高亮：邻居亮起，其他变暗
function applyHighlight(node) {
  activeNode = node;
  const neighbors = getNeighbors(node);
  nodes.forEach(n => {
    const el = domNodes[n.id];
    el.classList.remove('dimmed', 'highlighted');
    if (n.id === node.id || neighbors.has(n.id)) {
      el.classList.add('highlighted');
    } else {
      el.classList.add('dimmed');
    }
  });
  renderAll();
}

function clearHighlight() {
  activeNode = null;
  nodes.forEach(n => {
    domNodes[n.id].classList.remove('dimmed', 'highlighted');
  });
  renderAll();
}

// 简单全文搜索：匹配标题、分类、标签、正文
function performSearch(q) {
  q = q.trim().toLowerCase();
  if (!q) {
    searchResults.innerHTML = '<div class="search-hint">支持搜索节点标题、分类、标签和正文内容。</div>';
    return;
  }
  const matches = nodes.filter(n => {
    const hay = [
      n.title, n.category, n.label,
      (n.tags || []).join(' '),
      n.body.replace(/<[^>]+>/g, ' ')
    ].join(' ').toLowerCase();
    return hay.includes(q);
  });

  if (matches.length === 0) {
    searchResults.innerHTML = `<div class="search-empty">没有找到包含"${q}"的节点</div>`;
    return;
  }

  searchResults.innerHTML = matches.map(n => {
    const plain = n.body.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
    const idx = plain.toLowerCase().indexOf(q);
    let snippet = plain.slice(Math.max(0, idx - 20), idx + 80);
    if (idx > 20) snippet = '…' + snippet;
    return `<div class="search-result" data-id="${n.id}">
      <div class="sr-cat" style="color:${n.color}">${n.category}</div>
      <div class="sr-title">${n.title}</div>
      <div class="sr-snippet">${snippet}</div>
    </div>`;
  }).join('');

  // 点击结果跳转到节点
  searchResults.querySelectorAll('.search-result').forEach(el => {
    el.addEventListener('click', () => {
      const node = nodes.find(n => n.id === el.dataset.id);
      if (node) {
        closeSearch();
        resetView();
        closePanel();
        setTimeout(() => openPanel(node), 100);
      }
    });
  });
}

    '行为金融': ['行为金融', 'behavioral finance', '认知偏差', '损失厌恶', '异象'],
  };

  // 2. 停用词
  const STOP = new Set(['的','是','了','在','和','与','或','也','都','就','还','又','把','被','让','给','向','为','从','到','对','按','据','由','于','以','及','或','但','而','且','则','若','如','虽','虽','然','因','故','所','者','的','地','得','吗','呢','吧','啊','呀','哦','么','我','你','他','她','它','我们','你们','他们','这','那','这个','那个','这些','那些','什么','怎么','为什么','如何','哪','哪里','哪个','怎样','谁','何时','何地','何人','何事','何故','何如','何须','何妨','何必','何不','何尝','何曾','何止','何至','何须','有','没','没有','要','会','能','可以','可能','应该','需要','想要','希望','想','做','干','搞','弄','说','问','答','告诉','知道','明白','理解','看看','查看','查询','搜索','找','查找','寻求','获取','得到','获得','给','给予','提供','告诉','介绍','解释','说明','描述','分析','比较','对比','区别','差异','相同','类似','相似','相关','联系','关系','影响','作用','意义','目的','原因','结果','后果','效果','好处','坏处','优点','缺点','优势','劣势','长处','短处','特点','特征','性质','属性','类型','种类','分类','类别','方面','方向','领域','范围','内容','方面','部分','方面','等等','之类','什么','哪些','吧','吗','呢','啊','哦','么','呀','呗','嗯','哈','是不是','是不是','对不对','行不行','好不好','可不可以','能不能','要不要','有没有','是','不是','对','不对','行','不行','好','不好','可以','不可以','能','不能','要','不要','有','没有','什么','怎么','为什么','如何','which','what','why','how','when','where','who','the','a','an','is','are','was','were','be','been','being','have','has','had','do','does','did','will','would','should','can','could','may','might','must','of','in','on','at','to','for','with','by','from','about','into','through','during','before','after','above','below','up','down','out','off','over','under','again','further','then','once','here','there','all','any','both','each','few','more','most','other','some','such','no','nor','not','only','own','same','so','than','too','very','s','t','just','don','now','and','but','if','or','because','as','until','while','of','at','by','for','with','about','against','between','into','through']);

  // 3. 简易分词：词典优先 + 双字滑窗 + 单字
  function tokenize(text) {
    text = text.toLowerCase().replace(/[^\u4e00-\u9fa5a-z0-9]/g, ' ');
    const tokens = [];
    // 先用词典匹配（长词优先）
    const matched = new Set();
    Object.values(SYNONYMS).flat().forEach(term => {
      const lower = term.toLowerCase();
      if (text.includes(lower) && lower.length >= 2) {
        tokens.push(lower);
        // 标记已匹配位置（简化处理：直接替换为空格避免重复切分）
        text = text.replace(new RegExp(lower, 'g'), ' '.repeat(lower.length));
        matched.add(lower);
      }
    });
    // 中文双字滑窗
    const chineseChars = text.match(/[\u4e00-\u9fa5]{2,}/g) || [];
    chineseChars.forEach(seg => {
      for (let i = 0; i < seg.length - 1; i++) {
        const bigram = seg.substr(i, 2);
        if (!STOP.has(bigram)) tokens.push(bigram);
      }
      // 也加入单字（短词）
      if (seg.length <= 3) {
        for (const ch of seg) {
          if (!STOP.has(ch)) tokens.push(ch);
        }
      }
    });
    // 英文单词
    const engWords = text.match(/[a-z][a-z0-9]+/g) || [];
    engWords.forEach(w => { if (!STOP.has(w) && w.length >= 2) tokens.push(w); });
    return tokens;
  }

  // 4. 为每个节点预建索引（标签 + 标题 + 分类 + 标签 + 正文）
  const nodeIndex = nodes.map(n => {
    const fullText = [n.title, n.category, n.label, (n.tags || []).join(' '), n.body.replace(/<[^>]+>/g, ' ')].join(' ');
    const tokens = tokenize(fullText);
    // 词频
    const tf = {};
    tokens.forEach(t => { tf[t] = (tf[t] || 0) + 1; });
    return { node: n, tf, tokens: new Set(tokens), fullText: fullText.toLowerCase() };
  });

  // 5. 计算每个 token 的 IDF
  const df = {};
  nodeIndex.forEach(idx => {
    Object.keys(idx.tf).forEach(t => { df[t] = (df[t] || 0) + 1; });
  });
  const N = nodeIndex.length;
  const idf = {};
  Object.keys(df).forEach(t => {
    idf[t] = Math.log((N + 1) / (df[t] + 1)) + 1;
  });

  // 6. 给定 query tokens，对每个节点打分（TF-IDF + 字段加权）
  function scoreNode(idx, queryTokens) {
    let score = 0;
    const q = queryTokens.join(' ');
    // 标题命中加权
    if (idx.node.title && idx.node.title.toLowerCase().includes(q)) score += 30;
    // 单 token 评分
    queryTokens.forEach(t => {
      const tf = idx.tf[t] || 0;
      if (tf > 0) {
        score += tf * (idf[t] || 1);
        // 字段加权
        if (idx.node.title && idx.node.title.toLowerCase().includes(t)) score += 8;
        if (idx.node.label && idx.node.label.toLowerCase().includes(t)) score += 5;
        if ((idx.node.tags || []).some(tag => tag.toLowerCase().includes(t))) score += 4;
        if (idx.node.category && idx.node.category.toLowerCase().includes(t)) score += 2;
      }
      // 子串匹配（处理同词根）
      if (idx.fullText.includes(t) && tf === 0) score += 0.5;
    });
    return score;
  }

  // 7. 检索：返回 top-K 相关节点
  function retrieve(query, k = 3) {
    const qTokens = tokenize(query);
    if (qTokens.length === 0) return [];
    const scored = nodeIndex.map(idx => ({ node: idx.node, score: scoreNode(idx, qTokens) }));
    return scored.filter(x => x.score > 0).sort((a, b) => b.score - a.score).slice(0, k);
  }

  // 8. 生成回答：根据检索到的节点组合答案
  function generateAnswer(query) {
    const results = retrieve(query, 3);
    if (results.length === 0) {
      return {
        text: `抱歉，我在知识图谱里没有找到关于"<strong>${escapeHtml(query)}</strong>"的内容。\n\n可以试试这些关键词：\nCRS、FATCA、信托、家族办公室、37号文、内保外贷、BEPS、香港、新加坡、加密资产…`,
        sources: [],
        related: getDefaultSuggestions().slice(0, 4)
      };
    }
    const primary = results[0].node;
    const others = results.slice(1);

    // 从主节点正文中提取第一段作为摘要
    const cleanBody = primary.body.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
    const firstParagraph = cleanBody.split(/[。；;\n]/)[0] + '。';

    let text = `<strong>${primary.title}</strong>\n\n${firstParagraph}\n\n`;
    if (others.length > 0) {
      text += `<strong>相关延伸：</strong>\n`;
      others.forEach(r => {
        const summary = r.node.body.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim().split(/[。；;\n]/)[0];
        text += `· <strong>${r.node.title}</strong>：${summary}。\n`;
      });
    }
    return {
      text,
      sources: [{ node: primary, label: '📖 查看主节点' }],
      related: others.map(r => r.node.title)
    };
  }

  // 9. 预置推荐问题
  const SUGGESTIONS = [
    '什么是 CRS？和 FATCA 有什么区别？',
    '中国老板怎么把钱合法转到境外？',
    '新加坡家族办公室怎么设立？',
    '什么是 37 号文？',
    'BVI 和开曼怎么选？',
    'BEPS 2.0 对离岸架构有什么影响？',
    '内保外贷是什么？',
    '香港和新加坡哪个更适合做家办？',
    '加密资产在跨境架构里怎么用？',
    '什么是经济实质 ESR？',
    '信托能避税吗？',
    '美国绿卡持有者要注意什么税务问题？',
    '利率和汇率是什么关系？',
    '什么是通货膨胀？怎么保值？',
    '央行加息对投资有什么影响？',
    '什么是 CAPM 模型？',
    '价值投资的核心原则是什么？',
    '有效市场假说讲了什么？',
    '公司怎么估值？DCF 是什么？',
    'IPO 上市流程是怎样的？',
    '并购有哪些类型？',
    '什么是 WACC？',
    '行为金融发现了哪些市场异象？',
    '怎么做风险管理？对冲是什么意思？',
    '现代投资组合理论是什么？',
    '财政政策和货币政策有什么区别？'
  ];

  function getDefaultSuggestions() {
    return SUGGESTIONS;
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }

  return { generateAnswer, retrieve, SUGGESTIONS, getDefaultSuggestions };
})();

// ── AI UI 交互 ──
const aiBtn = document.getElementById('ai-btn');
const aiOverlay = document.getElementById('ai-overlay');
const aiClose = document.getElementById('ai-close');
const aiChat = document.getElementById('ai-chat');
const aiInput = document.getElementById('ai-input');
const aiSend = document.getElementById('ai-send');
const aiSuggestions = document.getElementById('ai-suggestions');

function openAI() {
  aiOverlay.classList.add('open');
  if (aiChat.children.length === 0) {
    // 首次打开，显示欢迎语
    addBotMessage(`你好！我是<strong>金融宇宙 AI</strong>。\n\n我已经掌握了知识图谱里的 <strong>88 个核心节点</strong>，涵盖：\n· 税务体系（CRS/FATCA/BEPS/转让定价…）\n· 架构工具（信托/家办/WFOE/基金会…）\n· 监管合规（AML/UBO/数据出境/FBAR…）\n· 金融产品（PE/REITs/加密/结构性产品…）\n· 主体身份（税务居民/护照/加比规则…）\n· 资金通道（FDI/内保外贷/QDII/资金池…）\n· 地区监管（香港/新加坡/BVI/美国/UAE…）\n· 宏观经济（利率/汇率/通胀/央行…）\n· 公司金融（财报/估值/IPO/并购…）\n· 投资理论（CAPM/EMH/价值投资/行为金融…）\n\n问我任何金融问题，我会基于图谱内容回答，并带你看具体节点。`);
    renderSuggestions(AI.getDefaultSuggestions().slice(0, 6));
  }
  setTimeout(() => aiInput.focus(), 350);
}
function closeAI() {
  aiOverlay.classList.remove('open');
}
function addUserMessage(text) {
  const div = document.createElement('div');
  div.className = 'ai-msg ai-msg-user';
  div.textContent = text;
  aiChat.appendChild(div);
  scrollToBottom();
}
function addBotMessage(html) {
  const div = document.createElement('div');
  div.className = 'ai-msg ai-msg-bot';
  div.innerHTML = html.replace(/\n/g, '<br>');
  aiChat.appendChild(div);
  scrollToBottom();
  return div;
}
function addTyping() {
  const div = document.createElement('div');
  div.className = 'ai-msg ai-msg-typing';
  aiChat.appendChild(div);
  scrollToBottom();
  return div;
}
function scrollToBottom() {
  aiChat.scrollTop = aiChat.scrollHeight;
}

function renderSuggestions(list) {
  aiSuggestions.innerHTML = '';
  list.forEach(q => {
    const chip = document.createElement('div');
    chip.className = 'ai-sugg-chip';
    chip.textContent = q;
    chip.addEventListener('click', () => {
      aiInput.value = q;
      handleSend();
    });
    aiSuggestions.appendChild(chip);
  });
}

function handleSend() {
  const q = aiInput.value.trim();
  if (!q) return;
  addUserMessage(q);
  aiInput.value = '';
  aiSend.disabled = true;

  const typing = addTyping();
  // 模拟思考延迟
  setTimeout(() => {
    typing.remove();
    const answer = AI.generateAnswer(q);
    const msgDiv = addBotMessage(answer.text);

    // 加来源节点跳转按钮
    if (answer.sources && answer.sources.length > 0) {
      answer.sources.forEach(src => {
        const btn = document.createElement('div');
        btn.className = 'ai-source';
        btn.textContent = src.label + '：' + src.node.title;
        btn.addEventListener('click', () => {
          closeAI();
          if (typeof openPanel === 'function') {
            openPanel(src.node);
          }
        });
        msgDiv.appendChild(document.createElement('br'));
        msgDiv.appendChild(btn);
      });
    }

    // 加相关追问
    if (answer.related && answer.related.length > 0) {
      const relatedDiv = document.createElement('div');
      relatedDiv.className = 'ai-related';
      relatedDiv.innerHTML = '🔍 你可能想接着问：';
      answer.related.forEach(r => {
        const chip = document.createElement('span');
        chip.className = 'ai-related-chip';
        chip.textContent = r;
        chip.addEventListener('click', () => {
          aiInput.value = r;
          handleSend();
        });
        relatedDiv.appendChild(chip);
      });
      msgDiv.appendChild(relatedDiv);
    }

    aiSend.disabled = false;
    aiInput.focus();
  }, 500 + Math.random() * 400);
}

aiBtn.addEventListener('click', openAI);
aiClose.addEventListener('click', closeAI);
aiSend.addEventListener('click', handleSend);
aiInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    handleSend();
  }
});
</script>
