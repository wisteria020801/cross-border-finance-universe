<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#050A14"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8" stop-opacity="0.6"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- 星点 -->
  <g fill="#FFFFFF">
    <circle cx="60" cy="80" r="1.5" opacity="0.6"/>
    <circle cx="450" cy="100" r="1.2" opacity="0.5"/>
    <circle cx="100" cy="420" r="1.8" opacity="0.7"/>
    <circle cx="420" cy="400" r="1.3" opacity="0.5"/>
    <circle cx="80" cy="250" r="1" opacity="0.4"/>
    <circle cx="440" cy="260" r="1.4" opacity="0.6"/>
    <circle cx="200" cy="60" r="1.1" opacity="0.5"/>
    <circle cx="320" cy="460" r="1" opacity="0.4"/>
  </g>
  <!-- 轨道环 -->
  <ellipse cx="256" cy="256" rx="180" ry="70" fill="none" stroke="#3B82F6" stroke-opacity="0.25" stroke-width="1.5" transform="rotate(-20 256 256)"/>
  <ellipse cx="256" cy="256" rx="150" ry="150" fill="none" stroke="#8B5CF6" stroke-opacity="0.18" stroke-width="1.2"/>
  <!-- 中心核 -->
  <circle cx="256" cy="256" r="38" fill="url(#core)"/>
  <circle cx="256" cy="256" r="38" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1"/>
  <!-- 模块节点 -->
  <g>
    <circle cx="120" cy="180" r="22" fill="#F59E0B"/>
    <circle cx="392" cy="180" r="22" fill="#3B82F6"/>
    <circle cx="120" cy="332" r="22" fill="#EC4899"/>
    <circle cx="392" cy="332" r="22" fill="#10B981"/>
    <circle cx="256" cy="420" r="20" fill="#8B5CF6"/>
  </g>
  <!-- 连线 -->
  <g stroke-opacity="0.35" stroke-width="1.5">
    <line x1="256" y1="256" x2="120" y2="180" stroke="#F59E0B"/>
    <line x1="256" y1="256" x2="392" y2="180" stroke="#3B82F6"/>
    <line x1="256" y1="256" x2="120" y2="332" stroke="#EC4899"/>
    <line x1="256" y1="256" x2="392" y2="332" stroke="#10B981"/>
    <line x1="256" y1="256" x2="256" y2="420" stroke="#8B5CF6"/>
  </g>
</svg>
